plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.lomohasher'
version = '0.7.9'

android {
  namespace "expo.modules.lomohasher"
  defaultConfig {
    versionCode 1
    versionName "0.7.9"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // 1.20.0's libonnxruntime4j_jni.so was only 4KB-page aligned, which Google Play
  // rejects. 1.23.0 fixed that file, but it also crashes face recognition on some
  // Android 16 phones: KleidiAI emits SME/SVE instructions the CPU does not have
  // (SIGILL). Extra RAM does not help. That detection bug is fixed in 1.24.
  // 1.31.1 still has 16KB LOAD alignment (0x4000) on arm64-v8a, armeabi-v7a, x86
  // and x86_64 for both libonnxruntime.so and libonnxruntime4j_jni.so.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  androidTestImplementation 'androidx.test:runner:1.5.2'
  androidTestImplementation 'androidx.test:rules:1.5.0'
}
