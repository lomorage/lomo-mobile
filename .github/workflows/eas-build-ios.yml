name: EAS Build iOS

# Manual trigger only: EAS free tier is 15 iOS builds/month,
# so this must NOT run on every push.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (production = App Store, preview = internal test build)"
        type: choice
        options:
          - production
          - preview
        default: production

jobs:
  build-ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # EAS must ask whether to log in to Apple. Declining lets it reuse the
      # existing remote distribution credentials while running from CI.
      - name: Build iOS with existing signing credentials
        shell: bash
        run: |
          printf 'n\n' | script -q -e -c 'env -u CI -u GITHUB_ACTIONS eas build --platform ios --profile "${{ inputs.profile }}"' /dev/null

      - name: Submit production build to App Store Connect
        if: ${{ inputs.profile == 'production' }}
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: eas submit --platform ios --profile production --latest --non-interactive
